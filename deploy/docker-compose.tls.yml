# DreamLand with a Caddy TLS reverse proxy.
#
#   DREAMLAND_DOMAIN=chat.example.com DREAMLAND_TLS_EMAIL=ops@example.com \
#   docker compose -f deploy/docker-compose.tls.yml up -d
#
# Only Caddy publishes ports. The DreamLand container stays on the internal
# network, so no plaintext HTTP port is exposed to the host.
name: dreamland-tls

services:
  dreamland:
    build:
      context: ..
      dockerfile: Dockerfile
    image: dreamland/server:dev
    container_name: dreamland
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      # Caddy is the only reachable entry point, so the IP allowlist would
      # only ever see the proxy address. TLS + basic auth replace it here.
      - DREAMLAND_MODE=server
      - DREAMLAND_LISTEN=true
      - DREAMLAND_WHITELIST_MODE=false
      - DREAMLAND_BASIC_AUTH_MODE=${DREAMLAND_BASIC_AUTH_MODE:-false}
      - DREAMLAND_BASIC_AUTH_USER=${DREAMLAND_BASIC_AUTH_USER:-}
      - DREAMLAND_BASIC_AUTH_PASSWORD=${DREAMLAND_BASIC_AUTH_PASSWORD:-}
      - DREAMLAND_COOKIE_SECRET=${DREAMLAND_COOKIE_SECRET:-}
      # Caddy only serves the configured site address, so a wrong Host never
      # reaches DreamLand. Turn the app-level host allowlist on (and list the
      # public hostname) for defence in depth.
      - DREAMLAND_HOST_WHITELIST_ENABLED=${DREAMLAND_HOST_WHITELIST_ENABLED:-false}
      - DREAMLAND_HOST_WHITELIST_HOSTS=${DREAMLAND_HOST_WHITELIST_HOSTS:-[]}
      # Upstream API keys come from a mounted secret document, not from config.yaml.
      - DREAMLAND_SECRETS_FILE=/run/secrets/dreamland-secrets.json
      - NODE_ENV=production
    volumes:
      - ../config:/home/node/app/config
      - ../data:/home/node/app/data
      - ../plugins:/home/node/app/plugins
      - ./secrets.json:/run/secrets/dreamland-secrets.json:ro
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.js"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: dreamland-caddy
    restart: unless-stopped
    depends_on:
      dreamland:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DREAMLAND_DOMAIN=${DREAMLAND_DOMAIN:-localhost}
      - DREAMLAND_TLS_EMAIL=${DREAMLAND_TLS_EMAIL:-}
      - CADDY_TLS=${CADDY_TLS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
