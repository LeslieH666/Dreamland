openapi: 3.1.0
info:
  title: Leslie Bridge
  version: '1'
  description: Process-local versioned API for external DreamLand clients. It is the seed for the public /api/v1 surface.
servers:
  - url: /api/leslie/bridge/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getBridgeHealth
      responses:
        '200':
          description: Bridge is authenticated and ready.
          content:
            application/json:
              schema:
                type: object
                required: [status, service, protocol]
                properties:
                  status: { const: ok }
                  service: { const: leslie-tavern }
                  protocol: { $ref: '#/components/schemas/Protocol' }
  /capabilities:
    get:
      operationId: getBridgeCapabilities
      responses:
        '200':
          description: Feature availability for this Bridge version.
          content:
            application/json:
              schema: { type: object }
  /models:
    get:
      operationId: listBridgeModels
      responses:
        '200':
          description: OpenAI-compatible model list.
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object: { const: list }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Model' }
  /voices:
    get:
      operationId: listBridgeVoices
      responses:
        '200':
          description: Volcengine public voice catalog.
  /audio/speech:
    post:
      operationId: createBridgeSpeech
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpeechRequest' }
      responses:
        '200':
          description: Synthesized MP3 audio.
          content:
            audio/mpeg:
              schema: { type: string, contentEncoding: binary }
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /model/chat/models:
    get:
      operationId: listBridgeChatModels
      description: Reports the single stable chat model that maps to the active upstream model.
      responses:
        '200':
          description: One stable chat model mapped to the active upstream model.
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object: { const: list }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ChatModel' }
        '409':
          $ref: '#/components/responses/ErrorResponse'
  /model/chat/completions:
    post:
      operationId: createBridgeModelChatCompletion
      description: OpenAI-compatible prompt gateway. The calling client owns the messages.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
      responses:
        '200':
          description: OpenAI-compatible JSON or server-sent event stream.
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    ErrorResponse:
      description: Stable Bridge error envelope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    Protocol:
      type: object
      required: [name, version]
      properties:
        name: { const: leslie-bridge }
        version: { const: '1' }
    Model:
      type: object
      required: [id, object, owned_by]
      properties:
        id: { const: leslie-volcengine-tts }
        object: { const: model }
        created: { type: integer }
        owned_by: { const: leslie-tavern }
    ChatModel:
      type: object
      required: [id, object, owned_by, leslie_source, leslie_upstream_model]
      properties:
        id: { const: leslie-current-chat }
        object: { const: model }
        created: { type: integer }
        owned_by: { const: leslie-tavern }
        leslie_source: { type: string }
        leslie_upstream_model: { type: string }
    ChatRequest:
      type: object
      required: [messages]
      properties:
        model: { const: leslie-current-chat, default: leslie-current-chat }
        messages:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: object }
        stream: { type: boolean, default: true }
        temperature: { type: number }
        top_p: { type: number }
        max_tokens: { type: integer, minimum: 1 }
        stop:
          type: array
          items: { type: string }
        tools:
          type: array
          items: { type: object }
    SpeechRequest:
      type: object
      required: [input, voice]
      properties:
        model:
          type: string
          enum: [leslie-volcengine-tts, tts-1]
          default: leslie-volcengine-tts
        input: { type: string, minLength: 1, maxLength: 10000 }
        voice: { type: string, minLength: 1, description: Volcengine speaker ID. }
        speed: { type: number, exclusiveMinimum: 0, default: 1 }
        response_format: { const: mp3, default: mp3 }
        resource_id: { type: string, minLength: 1 }
        language_mode:
          type: string
          enum: [auto, crosslingual, zh-cn, en, ja]
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            type: { type: string }
