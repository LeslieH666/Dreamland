<!DOCTYPE html>
<html>

<head>
    <base href="/">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, viewport-fit=cover, initial-scale=1, interactive-widget=resizes-content">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="darkreader-lock">
    <meta name="robots" content="noindex, nofollow" />
    <style>
        /* Put critical CSS here. The rest should go in stylesheets. */
        body {
            background-color: rgb(36, 36, 37);
        }
    </style>
    <link rel="preload" as="style" href="style.css">
    <link rel="apple-touch-icon" sizes="57x57" href="img/dreamland/icon-57.png" />
    <link rel="apple-touch-icon" sizes="72x72" href="img/dreamland/icon-72.png" />
    <link rel="apple-touch-icon" sizes="114x114" href="img/dreamland/icon-114.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="img/dreamland/icon-144.png" />
    <link rel="icon" href="img/dreamland/icon.ico" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="stylesheet" type="text/css" href="css/st-tailwind.css">
    <link rel="stylesheet" type="text/css" href="css/login.css">
    <link rel="manifest" crossorigin="use-credentials" href="manifest.json">
    <link href="webfonts/NotoSans/stylesheet.css" rel="stylesheet">
    <link href="webfonts/NotoSansMono/stylesheet.css" rel="stylesheet">
    <!-- fontawesome webfonts-->
    <link href="css/fontawesome.min.css" rel="stylesheet">
    <link href="css/solid.min.css" rel="stylesheet">
    <link href="css/user.css" rel="stylesheet">
    <link href="css/dreamland-tokens.css" rel="stylesheet">
    <link href="css/dreamland-blue-archive.css" rel="stylesheet">
    <link href="css/dreamland-login.css" rel="stylesheet">
    <link href="css/dreamland-game-controls.css" rel="stylesheet">
    <title>DreamLand · 选择用户空间</title>
    <link rel="stylesheet" href="css/dreamland-glass.css">
</head>

<body class="login leslie-modern" data-leslie-design-language="dreamland" data-dreamland-style="blue">
    <div class="leslie-login-backdrop" aria-hidden="true">
        <div class="leslie-login-ghost-sidebar"></div>
        <div class="leslie-login-ghost-chat"></div>
    </div>
    <div id="shadow_popup" style="opacity: 0;">
        <div id="dialogue_popup">
            <div id="dialogue_popup_holder">
                <div id="dialogue_popup_text">
                    <div id="userSelectBlock" class="flex-container flexFlowColumn alignItemsCenter">
                        <h2 id="logoBlock" class="flex-container">
                            <img src="img/dreamland/icon.svg" alt="" class="logo">
                            <span>DreamLand</span>
                        </h2>
                        <h3 id="normalLoginPrompt">
                            选择用户空间
                        </h3>
                        <h3 id="discreetLoginPrompt">
                            输入用户信息
                        </h3>
                        <div id="userListBlock" class="wide100p">
                            <div id="userList" class="flex-container justifySpaceEvenly"></div>
                            <div id="handleEntryBlock" style="display:none;" class="flex-container flexFlowColumn alignItemsCenter">
                                <input id="userHandle" class="text_pole" type="text" placeholder="用户账号" autocomplete="username">
                            </div>
                            <div id="passwordEntryBlock" style="display:none;"
                                class="flex-container flexFlowColumn alignItemsCenter">
                                <input id="userPassword" class="text_pole" type="password" placeholder="输入密码" autocomplete="current-password">
                                <a id="recoverPassword" href="#" onclick="return false;">忘记密码？</a>
                                <div class="flex-container">
                                    <button id="loginButton" type="button" class="menu_button">进入空间</button>
                                </div>
                            </div>
                            <div id="passwordRecoveryBlock" style="display:none;" class="flex-container flexFlowColumn alignItemsCenter">
                                <div id="recoverMessage">
                                    恢复代码已显示在电脑端服务控制台。
                                </div>
                                <input id="recoveryCode" class="text_pole" type="text" placeholder="恢复代码">
                                <input id="newPassword" class="text_pole" type="password" placeholder="新密码" autocomplete="new-password">
                                <div class="flex-container flexGap10">
                                    <button id="sendRecovery" type="button" class="menu_button">提交</button>
                                    <button id="cancelRecovery" type="button" class="menu_button">返回</button>
                                </div>
                            </div>
                        </div>
                        <div class="neutral_warning" id="errorMessage">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="lib/jquery-3.5.1.min.js"></script>
    <script src="scripts/login.js" type="module"></script>
    <script src="scripts/dreamland-login.js" type="module"></script>
</body>

</html>
